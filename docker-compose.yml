services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me-now}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-change-me-now}' 'RETURN 1' >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      args:
        VIDQUERY_EXTRAS: ${VIDQUERY_EXTRAS:-full}
    environment:
      ENABLE_NEO4J: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me-now}
      ENABLE_YOLO: ${ENABLE_YOLO:-false}
      ENABLE_WHISPER: ${ENABLE_WHISPER:-false}
      ENABLE_DIARIZATION: ${ENABLE_DIARIZATION:-true}
      REQUIRE_DIARIZATION: ${REQUIRE_DIARIZATION:-true}
      SEMANTIC_RETRIEVAL_MODE: ${CONTAINER_SEMANTIC_RETRIEVAL_MODE:-hashing}
      ENABLE_RAG_GENERATION: ${ENABLE_RAG_GENERATION:-true}
      RAG_PROVIDER: ${RAG_PROVIDER:-groq}
      RAG_MODEL: ${RAG_MODEL:-${GROQ_MODEL:-openai/gpt-oss-20b}}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_EVIDENCE_SCORE: ${RAG_MIN_EVIDENCE_SCORE:-0.20}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-15}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-${HF_TOKEN:-}}
      CORS_ORIGINS: http://localhost:8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - vidquery_data:/app/data/app
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  vidquery_data:
