<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<title>AVA action GNN data scaling from 17 to 30 videos</title>
<desc>Four measured validation and held-out test metrics using the same fixed validation and test videos.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#111827">
<text x="55" y="71" font-size="16" font-weight="600">Validation supported macro F1</text>
<line x1="130" y1="210" x2="450" y2="210" stroke="#d1d5db"/>
