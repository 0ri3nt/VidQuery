<text x="130.0" y="232" font-size="12" text-anchor="middle">17 videos</text>
<circle cx="450.0" cy="114.2" r="5" fill="#2563eb"/>
<text x="450.0" y="103.2" font-size="13" text-anchor="middle">0.109693</text>
<text x="450.0" y="232" font-size="12" text-anchor="middle">30 videos</text>
<text x="505" y="71" font-size="16" font-weight="600">Test supported macro F1</text>
<line x1="580" y1="210" x2="900" y2="210" stroke="#d1d5db"/>
<polyline points="580.0,124.4 900.0,114.2" fill="none" stroke="#7c3aed" stroke-width="3"/>
<circle cx="580.0" cy="124.4" r="5" fill="#7c3aed"/>
<text x="580.0" y="113.4" font-size="13" text-anchor="middle">0.060309</text>
<text x="580.0" y="232" font-size="12" text-anchor="middle">17 videos</text>
<circle cx="900.0" cy="114.2" r="5" fill="#7c3aed"/>
<text x="900.0" y="103.2" font-size="13" text-anchor="middle">0.067558</text>
<text x="900.0" y="232" font-size="12" text-anchor="middle">30 videos</text>
<text x="55" y="311" font-size="16" font-weight="600">Test micro F1</text>
<line x1="130" y1="450" x2="450" y2="450" stroke="#d1d5db"/>
<polyline points="130.0,356.5 450.0,354.2" fill="none" stroke="#059669" stroke-width="3"/>
<circle cx="130.0" cy="356.5" r="5" fill="#059669"/>
<text x="130.0" y="345.5" font-size="13" text-anchor="middle">0.408184</text>
<text x="130.0" y="472" font-size="12" text-anchor="middle">17 videos</text>
<circle cx="450.0" cy="354.2" r="5" fill="#059669"/>
<text x="450.0" y="343.2" font-size="13" text-anchor="middle">0.418315</text>
<text x="450.0" y="472" font-size="12" text-anchor="middle">30 videos</text>
<text x="505" y="311" font-size="16" font-weight="600">Test mAP</text>
<line x1="580" y1="450" x2="900" y2="450" stroke="#d1d5db"/>
<polyline points="580.0,363.0 900.0,354.2" fill="none" stroke="#d97706" stroke-width="3"/>
<circle cx="580.0" cy="363.0" r="5" fill="#d97706"/>
<text x="580.0" y="352.0" font-size="13" text-anchor="middle">0.064652</text>
<text x="580.0" y="472" font-size="12" text-anchor="middle">17 videos</text>
<circle cx="900.0" cy="354.2" r="5" fill="#d97706"/>
