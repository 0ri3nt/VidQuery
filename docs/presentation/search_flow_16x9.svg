<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f5f8a"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>

  <!-- Row bands -->
  <rect x="10" y="20" width="1260" height="205" rx="14" fill="#f3f6f9"/>
  <rect x="10" y="240" width="1260" height="200" rx="14" fill="#f3f6f9"/>
  <rect x="10" y="455" width="1260" height="255" rx="14" fill="#f3f6f9"/>
  <g font-size="15" font-weight="700" fill="#2f5f8a">
    <text x="70" y="48">1 · Understand the query</text>
    <text x="70" y="268">2 · Find and localize</text>
    <text x="70" y="483">3 · Answer</text>
  </g>

  <g fill="#ffffff" stroke="#2f5f8a" stroke-width="2">
    <!-- Row 1 -->
    <rect x="20" y="99" width="180" height="72" rx="10"/>
    <rect x="250" y="99" width="230" height="72" rx="10"/>
    <rect x="560" y="99" width="240" height="72" rx="10" stroke-dasharray="7 5"/>
    <rect x="870" y="99" width="240" height="72" rx="10"/>
    <!-- Row 2 -->
    <rect x="870" y="315" width="240" height="80" rx="10"/>
    <rect x="520" y="319" width="260" height="72" rx="10"/>
    <polygon points="300,295 410,355 300,415 190,355"/>
    <!-- Row 3 -->
    <rect x="180" y="535" width="240" height="80" rx="10"/>
    <rect x="490" y="535" width="240" height="80" rx="10"/>
    <rect x="800" y="535" width="310" height="80" rx="10"/>
    <rect x="490" y="636" width="240" height="56" rx="10"/>
  </g>

  <!-- SQLite cylinder -->
  <g fill="#ffffff" stroke="#2f5f8a" stroke-width="2">
    <path d="M1150,325 L1150,385 A45,10 0 0 0 1240,385 L1240,325"/>
    <ellipse cx="1195" cy="325" rx="45" ry="10"/>
  </g>

  <!-- Titles -->
  <g font-size="16" font-weight="700" fill="#1f2933" text-anchor="middle">
    <text x="110" y="129">Natural-language</text>
    <text x="110" y="150">query</text>
    <text x="365" y="129">Rule-based parser</text>
    <text x="680" y="129">Groq planner</text>
    <text x="990" y="129">Query hypotheses</text>
    <text x="990" y="341">Hybrid ranking</text>
    <text x="650" y="348">Localizer</text>
    <text x="300" y="351">Reliability</text>
    <text x="300" y="371">verdict</text>
    <text x="1195" y="355">SQLite</text>
    <text x="300" y="565">Groq grounded answer</text>
    <text x="610" y="565">Claim check</text>
    <text x="955" y="565">UI: ranked evidence</text>
    <text x="610" y="661">Abstain</text>
  </g>
  <!-- Subtitles -->
  <g font-size="13" fill="#4a5b6b" text-anchor="middle">
    <text x="365" y="151">80-label action lexicon</text>
    <text x="680" y="151">gpt-oss-20b · validated labels</text>
    <text x="990" y="151">"Did you mean…?" chips</text>
    <text x="990" y="362">speech · semantic · objects</text>
    <text x="990" y="380">actions · OCR · relations</text>
    <text x="650" y="370">peak: word / frame / interval</text>
    <text x="1195" y="372">segments</text>
    <text x="300" y="588">cites real result IDs</text>
    <text x="610" y="587">times · quotes · objects</text>
    <text x="610" y="604">actions · speakers</text>
    <text x="955" y="588">verdict chips · seek to peak</text>
    <text x="610" y="680">closest moments shown as insufficient</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#2f5f8a" stroke-width="2" marker-end="url(#arrow)">
    <line x1="200" y1="135" x2="248" y2="135"/>
    <line x1="480" y1="135" x2="558" y2="135"/>
    <line x1="800" y1="135" x2="868" y2="135"/>
    <path d="M365,99 L365,72 L990,72 L990,97"/>
    <line x1="990" y1="171" x2="990" y2="313"/>
    <line x1="1150" y1="355" x2="1112" y2="355"/>
    <line x1="870" y1="355" x2="782" y2="355"/>
    <line x1="520" y1="355" x2="412" y2="355"/>
    <line x1="300" y1="415" x2="300" y2="533"/>
    <line x1="420" y1="575" x2="488" y2="575"/>
    <line x1="730" y1="575" x2="798" y2="575"/>
    <path d="M190,355 L45,355 L45,664 L488,664"/>
    <path d="M730,664 L955,664 L955,617"/>
  </g>

  <!-- Edge labels -->
  <g font-size="13" font-style="italic" fill="#4a5b6b">
    <text x="520" y="126" text-anchor="middle">ambiguous</text>
    <text x="677" y="65" text-anchor="middle">clear query</text>
    <text x="312" y="480">supported / weak</text>
    <text x="70" y="346">insufficient</text>
  </g>
</svg>
