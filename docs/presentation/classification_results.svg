<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="1280" height="600" fill="#fcfcfb"/>

  <!-- Legend -->
  <g font-size="15" fill="#0b0b0b">
    <rect x="90" y="24" width="16" height="16" rx="3" fill="#2a78d6"/>
    <text x="114" y="38">Graph neural network (GAT): used in VidQuery</text>
    <rect x="520" y="24" width="16" height="16" rx="3" fill="#eb6834"/>
    <text x="544" y="38">Simpler network (MLP), same inputs, for comparison</text>
  </g>

  <!-- Panel titles -->
  <text x="90" y="82" font-size="18" font-weight="700" fill="#0b0b0b">AVA: recognising 80 person actions</text>
  <text x="90" y="101" font-size="13" fill="#52514e">Macro F1 on 6 unseen test videos (10,459 people)</text>
  <text x="720" y="82" font-size="18" font-weight="700" fill="#0b0b0b">VidOR: recognising 50 object relations</text>
  <text x="720" y="101" font-size="13" fill="#52514e">Macro F1 on 50 unseen test videos (8,725 object pairs)</text>

  <!-- Grid: AVA (0..0.10 over 290 px) -->
  <g stroke="#e6e6e3" stroke-width="1">
    <line x1="90" y1="400" x2="560" y2="400" stroke="#b9b8b2"/>
    <line x1="90" y1="327.5" x2="560" y2="327.5"/>
    <line x1="90" y1="255" x2="560" y2="255"/>
    <line x1="90" y1="182.5" x2="560" y2="182.5"/>
    <line x1="90" y1="110" x2="560" y2="110"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="82" y="404">0</text><text x="82" y="331">0.025</text><text x="82" y="259">0.05</text>
    <text x="82" y="186">0.075</text><text x="82" y="114">0.10</text>
  </g>

  <!-- Grid: VidOR (0..0.25 over 290 px) -->
  <g stroke="#e6e6e3" stroke-width="1">
    <line x1="720" y1="400" x2="1240" y2="400" stroke="#b9b8b2"/>
    <line x1="720" y1="342" x2="1240" y2="342"/>
    <line x1="720" y1="284" x2="1240" y2="284"/>
    <line x1="720" y1="226" x2="1240" y2="226"/>
    <line x1="720" y1="168" x2="1240" y2="168"/>
    <line x1="720" y1="110" x2="1240" y2="110"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="712" y="404">0</text><text x="712" y="346">0.05</text><text x="712" y="288">0.10</text>
    <text x="712" y="230">0.15</text><text x="712" y="172">0.20</text><text x="712" y="114">0.25</text>
  </g>

  <!-- AVA bars -->
  <g fill="#2a78d6">
    <path d="M148,400 V192.3 Q148,188.3 152,188.3 H204 Q208,188.3 208,192.3 V400 Z"/>
    <path d="M378,400 V148.8 Q378,144.8 382,144.8 H434 Q438,144.8 438,148.8 V400 Z"/>
  </g>
  <g fill="#eb6834">
    <path d="M212,400 V186.5 Q212,182.5 216,182.5 H268 Q272,182.5 272,186.5 V400 Z"/>
    <path d="M442,400 V154.6 Q442,150.6 446,150.6 H498 Q502,150.6 502,154.6 V400 Z"/>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="178" y="180">0.073</text><text x="242" y="174">0.075</text>
    <text x="408" y="136" font-weight="700">0.088</text><text x="472" y="142">0.086</text>
  </g>
  <g font-size="14" fill="#0b0b0b" text-anchor="middle">
    <text x="210" y="424">24 training videos</text><text x="440" y="424">94 training videos</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="210" y="441">earlier model</text><text x="440" y="441">current model (v8)</text>
  </g>
  <rect x="244" y="118" width="122" height="24" rx="12" fill="#ffffff" stroke="#2a78d6"/>
  <text x="305" y="135" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">+0.015, significant</text>

  <!-- VidOR bars -->
  <g fill="#2a78d6">
    <path d="M742,400 V321.6 Q742,317.6 746,317.6 H794 Q798,317.6 798,321.6 V400 Z"/>
    <path d="M917,400 V205.6 Q917,201.6 921,201.6 H969 Q973,201.6 973,205.6 V400 Z"/>
    <path d="M1092,400 V151.1 Q1092,147.1 1096,147.1 H1144 Q1148,147.1 1148,151.1 V400 Z"/>
  </g>
  <g fill="#eb6834">
    <path d="M802,400 V320.5 Q802,316.5 806,316.5 H854 Q858,316.5 858,320.5 V400 Z"/>
    <path d="M977,400 V211.4 Q977,207.4 981,207.4 H1029 Q1033,207.4 1033,211.4 V400 Z"/>
    <path d="M1152,400 V133.7 Q1152,129.7 1156,129.7 H1204 Q1208,129.7 1208,133.7 V400 Z"/>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="770" y="309">0.071</text><text x="830" y="308">0.072</text>
    <text x="945" y="193">0.171</text><text x="1005" y="199">0.166</text>
    <text x="1120" y="139" font-weight="700">0.218</text><text x="1180" y="121">0.233</text>
  </g>
  <g font-size="14" fill="#0b0b0b" text-anchor="middle">
    <text x="800" y="424">57 training videos</text><text x="975" y="424">400 training videos</text>
    <text x="1150" y="424">1,900 training videos</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="800" y="441">v2</text><text x="975" y="441">v3</text><text x="1150" y="441">current model (v4)</text>
  </g>
  <rect x="975" y="118" width="122" height="24" rx="12" fill="#ffffff" stroke="#2a78d6"/>
  <text x="1036" y="135" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">+0.047, significant</text>

  <!-- Takeaway cards -->
  <g fill="#eef3f9">
    <rect x="40" y="470" width="380" height="112" rx="12"/>
    <rect x="450" y="470" width="380" height="112" rx="12"/>
    <rect x="860" y="470" width="380" height="112" rx="12"/>
  </g>
  <g font-size="17" font-weight="700" fill="#0b0b0b">
    <text x="60" y="503">More training data helped both</text>
    <text x="470" y="503">Graph vs. simpler network: a tie</text>
    <text x="880" y="503">Why the AVA numbers look low</text>
  </g>
  <g font-size="14" fill="#52514e">
    <text x="60" y="532">AVA +0.015 and VidOR +0.047 macro F1;</text>
    <text x="60" y="554">both improvements are statistically significant</text>
    <text x="470" y="532">No significant difference in macro F1;</text>
    <text x="470" y="554">VidQuery's pipeline is built on the graph model</text>
    <text x="880" y="532">Macro F1 weighs all 80 actions equally,</text>
    <text x="880" y="554">including rare ones; frequency-weighted F1 is 0.50</text>
  </g>
</svg>
