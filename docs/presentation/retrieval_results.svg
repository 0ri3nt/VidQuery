<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="1280" height="600" fill="#fcfcfb"/>

  <!-- Legend -->
  <g font-size="15" fill="#0b0b0b">
    <rect x="90" y="24" width="16" height="16" rx="3" fill="#2a78d6"/>
    <text x="114" y="38">VidQuery, selected settings (used in demo)</text>
    <rect x="470" y="24" width="16" height="16" rx="3" fill="#eb6834"/>
    <text x="494" y="38">VidQuery, default (strict) settings</text>
    <rect x="800" y="24" width="16" height="16" rx="3" fill="#a9a8a2"/>
    <text x="824" y="38">Guess that ignores the video</text>
  </g>

  <!-- Panel titles -->
  <text x="90" y="82" font-size="18" font-weight="700" fill="#0b0b0b">Finding the right moment</text>
  <text x="90" y="101" font-size="13" fill="#52514e">Charades-STA, 300 unseen videos: top result correct (R@1, overlap ≥ 0.5)</text>
  <text x="720" y="82" font-size="18" font-weight="700" fill="#0b0b0b">Saying "not in this video"</text>
  <text x="720" y="101" font-size="13" fill="#52514e">NA-VMR: 855 unrelated + 863 plausible-but-absent questions</text>

  <!-- Left grid 0..0.5 over 275 px -->
  <g stroke="#e6e6e3">
    <line x1="90" y1="400" x2="600" y2="400" stroke="#b9b8b2"/>
    <line x1="90" y1="345" x2="600" y2="345"/><line x1="90" y1="290" x2="600" y2="290"/>
    <line x1="90" y1="235" x2="600" y2="235"/><line x1="90" y1="180" x2="600" y2="180"/>
    <line x1="90" y1="125" x2="600" y2="125"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="82" y="404">0</text><text x="82" y="349">0.1</text><text x="82" y="294">0.2</text>
    <text x="82" y="239">0.3</text><text x="82" y="184">0.4</text><text x="82" y="129">0.5</text>
  </g>
  <path d="M125,400 V340.2 Q125,336.2 129,336.2 H201 Q205,336.2 205,340.2 V400 Z" fill="#a9a8a2"/>
  <path d="M245,400 V330.8 Q245,326.8 249,326.8 H321 Q325,326.8 325,330.8 V400 Z" fill="#eb6834"/>
  <path d="M365,400 V256.1 Q365,252.1 369,252.1 H441 Q445,252.1 445,256.1 V400 Z" fill="#a9a8a2"/>
  <path d="M485,400 V179.6 Q485,175.6 489,175.6 H561 Q565,175.6 565,179.6 V400 Z" fill="#2a78d6"/>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="165" y="328">0.116</text><text x="285" y="319">0.133</text>
    <text x="405" y="244">0.269</text><text x="525" y="168" font-weight="700">0.408</text>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="165" y="422">Random segment</text><text x="285" y="422">VidQuery default</text>
    <text x="405" y="422">Fixed position</text><text x="525" y="422">VidQuery selected</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="165" y="439">5 s window</text><text x="285" y="439">10 s window</text>
    <text x="405" y="439">~9 s window</text><text x="525" y="439">10 s window</text>
  </g>
  <rect x="300" y="128" width="200" height="24" rx="12" fill="#ffffff" stroke="#2a78d6"/>
  <text x="400" y="145" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">+0.275 vs default, significant</text>

  <!-- Right grid 0..100% over 275 px -->
  <g stroke="#e6e6e3">
    <line x1="720" y1="400" x2="1240" y2="400" stroke="#b9b8b2"/>
    <line x1="720" y1="331.25" x2="1240" y2="331.25"/><line x1="720" y1="262.5" x2="1240" y2="262.5"/>
    <line x1="720" y1="193.75" x2="1240" y2="193.75"/><line x1="720" y1="125" x2="1240" y2="125"/>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="end">
    <text x="712" y="404">0%</text><text x="712" y="335">25%</text><text x="712" y="266">50%</text>
    <text x="712" y="198">75%</text><text x="712" y="129">100%</text>
  </g>
  <g fill="#2a78d6">
    <path d="M746,400 V130.9 Q746,126.9 750,126.9 H802 Q806,126.9 806,130.9 V400 Z"/>
    <rect x="921" y="397.8" width="60" height="2.2"/>
    <path d="M1096,400 V131.5 Q1096,127.5 1100,127.5 H1152 Q1156,127.5 1156,131.5 V400 Z"/>
  </g>
  <g fill="#eb6834">
    <path d="M810,400 V131.2 Q810,127.2 814,127.2 H866 Q870,127.2 870,131.2 V400 Z"/>
    <path d="M985,400 V238.2 Q985,234.2 989,234.2 H1041 Q1045,234.2 1045,238.2 V400 Z"/>
    <path d="M1160,400 V265.4 Q1160,261.4 1164,261.4 H1216 Q1220,261.4 1220,265.4 V400 Z"/>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="776" y="120" font-weight="700">99.3%</text><text x="840" y="120">99.2%</text>
    <text x="951" y="390" font-weight="700">0.8%</text><text x="1015" y="227">60.3%</text>
    <text x="1126" y="120" font-weight="700">99.1%</text><text x="1190" y="254">50.4%</text>
  </g>
  <g font-size="13" fill="#0b0b0b" text-anchor="middle">
    <text x="808" y="422">Unrelated questions</text><text x="983" y="422">Plausible but absent</text>
    <text x="1158" y="422">Real questions</text>
  </g>
  <g font-size="12" fill="#52514e" text-anchor="middle">
    <text x="808" y="439">rejected</text><text x="983" y="439">rejected</text><text x="1158" y="439">answered</text>
  </g>

  <!-- Takeaway cards -->
  <g fill="#eef3f9">
    <rect x="40" y="470" width="380" height="112" rx="12"/>
    <rect x="450" y="470" width="380" height="112" rx="12"/>
    <rect x="860" y="470" width="380" height="112" rx="12"/>
  </g>
  <g font-size="17" font-weight="700" fill="#0b0b0b">
    <text x="60" y="503">Search design matters most</text>
    <text x="470" y="503">Unrelated questions: refused</text>
    <text x="880" y="503">Open problem: plausible but absent</text>
  </g>
  <g font-size="14" fill="#52514e">
    <text x="60" y="532">Selected settings: +0.275 over default,</text>
    <text x="60" y="554">well above guesses that ignore the video</text>
    <text x="470" y="532">99% of questions about things that cannot</text>
    <text x="470" y="554">be in these videos are refused</text>
    <text x="880" y="532">Demo settings still answer them; strict</text>
    <text x="880" y="554">settings refuse 60% but answer only half</text>
  </g>
</svg>
